    {
      "name": "residential_spend_per_customer",
      "check_sql": "SELECT (SELECT count(*) FROM tx_res_spend) = 1 AND abs((SELECT max(dollars_per_customer) FROM tx_res_spend) / (SELECT r.value * 1000000 / c.value FROM eia.main.observations('electricity/retail-sales', 'revenue', 'annual', facets_json := '{\"stateid\":[\"TX\"],\"sectorid\":[\"RES\"]}', start_period := '2023', end_period := '2023') AS r JOIN eia.main.observations('electricity/retail-sales', 'customers', 'annual', facets_json := '{\"stateid\":[\"TX\"],\"sectorid\":[\"RES\"]}', start_period := '2023', end_period := '2023') AS c USING (period)) - 1) < 0.001"
    }
